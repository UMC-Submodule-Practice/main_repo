name: Continuous Integration

on:
  push:
    # prod를 제외한 모든 브랜치에 push 이벤트 시 동작
    branches-ignore:
      - prod
  # main 브랜치에 대해 pr 이벤트 시 동작
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  # Docker Hub 사용
  REGISTRY: docker.io
  REGISTRY_USERNAME: ${{ github.actor }}

jobs:
  Build:
    name: Build & Delivery
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ACTION_TOKEN }}
          submodules: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Prepare environment
        run: |
          mkdir -p src/main/resources/application-config
          cp -r ./config/* src/main/resources/application-config/

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Test with Gradle
        run: SPRING_PROFILES_ACTIVE=test ./gradlew test

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2.15.1
        if: always()
        with:
          files: '**/build/test-results/test/TEST-*.xml'

      - name: Set Docker Image Tag
        id: set_docker_image_tag
        run: |
          echo "REPOSITORY=${{ github.repository }}" >> $GITHUB_ENV
          echo "IMAGE_TAG=ci-${{ github.repository }}-${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_ENV

      - name: Lowercase the image tag & repository
        run: |
          echo "REPOSITORY=$(echo $REPOSITORY | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_TAG=$(echo $IMAGE_TAG | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set Spring Image Environment Variable
        run: |
          echo "SPRING_IMAGE=${{ env.REGISTRY }}/${{ env.REPOSITORY }}:${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Docker Image Build
        run: |
          docker build --no-cache -t ${{ env.SPRING_IMAGE }} -f Dockerfile-CI .

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Docker Hub Push
        run: docker push ${{ env.SPRING_IMAGE }}
